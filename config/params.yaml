matching_node:
  ros__parameters:
    # Preprocessing
    default_voxel_resolution: 0.05
    max_range: 80.0
    min_range: 0.5

    # KISS-Matcher coarse matching
    kiss_matcher:
      voxel_size: 0.05

    # small_gicp fine matching
    fine_matching:
      method: "VGICP"
      max_iterations: 100
      max_correspondence_distance: 1.0
      voxel_resolution: 1.0
      num_threads: 4
      num_neighbors: 20

    # Quality thresholds
    quality:
      min_fitness_score: 0.3
      max_rmse: 0.5